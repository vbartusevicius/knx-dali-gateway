# Docker integration lab, C++ unit/sanitized tests, ESP32-C6 firmware build and release (firmware.bin + merged first-install image).
name: lab

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish (e.g. v26.10.15.2100)"
        required: false
        type: string

jobs:
  firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PlatformIO
        run: pip install platformio==6.1.16

      - name: Run native and sanitized C++ unit tests
        run: pio test -d gateway -e native -e native_sanitized

      - name: Build ESP32-C6 firmware (dev_c6 and release_c6)
        run: |
          COMMIT_TS="$(git show -s --format=%ct HEAD)"
          export FW_VERSION="$(date -u -d "@$COMMIT_TS" +%y.%m.%d.%H%M)"
          echo "FW_VERSION=$FW_VERSION" >> "$GITHUB_ENV"
          pio run -d gateway -e dev_c6 -e release_c6
          mkdir -p gateway/build/artifacts
          cp gateway/.pio/build/release_c6/firmware.bin gateway/build/artifacts/firmware.bin
          cp gateway/.pio/build/release_c6/firmware-full-usb.bin gateway/build/artifacts/firmware-full-usb.bin

      - name: Package Hardware Release Bundles (V2, V3)
        run: |
          mkdir -p gateway/build/artifacts
          for v in v2 v3; do
            (cd hardware/releases/$v && zip -r ../../../gateway/build/artifacts/knx-dali-gateway-hardware-${v}.zip . -x "*.DS_Store")
          done

      - name: Upload firmware.bin (OTA update through the web UI)
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: gateway/build/artifacts/firmware.bin
          if-no-files-found: error

      - name: Upload firmware-full-usb.bin (USB install at 0x0 on an empty ESP32-C6)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-full-usb
          path: gateway/build/artifacts/firmware-full-usb.bin
          if-no-files-found: error

      - name: Upload hardware bundles
        uses: actions/upload-artifact@v4
        with:
          name: hardware-bundles
          path: gateway/build/artifacts/knx-dali-gateway-hardware-*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release on push/merge to main, tag, or manual dispatch
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            REL_TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            REL_TAG="$GITHUB_REF_NAME"
          else
            REL_TAG="v${FW_VERSION}"
          fi
          gh release view "$REL_TAG" >/dev/null 2>&1 || gh release create "$REL_TAG" --target "$GITHUB_SHA" --title "$REL_TAG" --generate-notes
          gh release upload "$REL_TAG" \
            gateway/build/artifacts/firmware.bin \
            gateway/build/artifacts/firmware-full-usb.bin \
            gateway/build/artifacts/knx-dali-gateway-hardware-v2.zip \
            gateway/build/artifacts/knx-dali-gateway-hardware-v3.zip \
            --clobber

  scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the lab scenarios
        run: simulation/run-tests.sh
