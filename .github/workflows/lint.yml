name: lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ruff over all repository Python
        run: docker compose --profile lint run --rm -T lint check .

  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format and clang-tidy over gateway/
        run: docker compose --profile lint run --rm -T cpp-lint gateway/scripts/check_cpp.sh
