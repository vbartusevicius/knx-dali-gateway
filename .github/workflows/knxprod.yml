# ETS product database verification: the committed firmware header must match
# the XML, and every push/PR verifies KnxDaliGateway.knxprod (schema
# project/20, ETS 5.7 and ETS 6). Signed release publishing runs in release.yml.
name: knxprod

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knxprod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the knxprod image
        run: docker compose --profile knxprod build producer

      - name: Committed firmware header matches the ETS XML
        run: knxprod/scripts/check.sh

      - name: Verifier tests
        run: docker compose --profile knxprod run --rm -T --entrypoint python3 producer -m pytest -q tests

      - name: Build and verify the .knxprod (unsigned)
        run: knxprod/scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: knxprod
          path: knxprod/build/KnxDaliGateway.knxprod
