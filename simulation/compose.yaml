# Docker integration lab: the real gateway (thelsing KNX/IP stack + gateway
# modules) talking to a simulated DALI bus, driven by pytest over KNXnet/IP
# routing multicast. Entry point:
#   docker compose -f simulation/compose.yaml run --rm tests
# then `docker compose -f simulation/compose.yaml down` to clean up.

services:
  dali-sim:
    build:
      context: ..
      dockerfile: simulation/Dockerfile.python
    command: ["python", "-m", "dali_sim"]
    environment:
      SIM_PORT: "5555"
      CONTROL_PORT: "5556"
      # 4 gear, two in DALI group 0: Tc DT8, RGBWAF DT8, xy DT8, non-DT8.
      SIM_GEAR: '[{"short":0,"groups":[0],"colour":"tc"},{"short":1,"groups":[0],"colour":"rgbwaf"},{"short":2,"colour":"xy"},{"short":3}]'
      # Control devices (must match scenario.INITIAL_DEVICES): 4 push-button
      # instances, 2 occupancy instances, 1 light instance (resolution 5).
      SIM_DEVICES: '[{"short":0,"instances":[1,1,1,1]},{"short":1,"instances":[3,3]},{"short":2,"instances":[4],"resolutions":[5]}]'
    networks: [lab]

  gateway-lab:
    build:
      context: ..
      dockerfile: simulation/Dockerfile.gateway
    environment:
      DALI_SIM_HOST: dali-sim
      DALI_SIM_PORT: "5555"
      KNX_FLASH_FILE: /tmp/lab-flash.bin
      DALI_LEVELS_FILE: /tmp/lab-levels.txt
    depends_on: [dali-sim]
    networks: [lab]

  tests:
    build:
      context: ..
      dockerfile: simulation/Dockerfile.python
    working_dir: /app
    command: ["python", "-m", "pytest", "-v", "-s", "tests/"]
    environment:
      DALI_SIM_HOST: dali-sim
      DALI_SIM_CONTROL_PORT: "5556"
    depends_on: [dali-sim, gateway-lab]
    networks: [lab]

networks:
  lab:
    driver: bridge
