[project]
name = "knx-dali-gateway-lab"
version = "0.1.0"
description = "Integration-lab simulator and tests for the KNX-DALI gateway"
requires-python = ">=3.10"
dependencies = [
    "python-dali==0.11",
    "xknx==3.20.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dali_sim", "src/knx_programmer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".venv"]
