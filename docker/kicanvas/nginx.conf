server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /pcb/ {
        alias /pcb/;
        autoindex on;
        # KiCad files are text; serve with correct MIME
        types {
            text/plain kicad_pcb kicad_sch kicad_pro kicad_dru;
        }
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
