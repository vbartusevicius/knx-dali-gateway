server {
    listen 80;
    root /usr/share/nginx/html;

    location /models/ {
        alias /models/;
        autoindex on;
        autoindex_format json;
        add_header Content-Disposition 'inline';
        add_header Access-Control-Allow-Origin *;
        types { model/stl stl; }
        default_type application/octet-stream;
    }
}
