#
# Deterministic placement plan for the lower board. Coordinates are in
# board-local millimetres, matching hardware/product/spec.yaml:
# x = right, y = up, origin at the bottom-left board corner.
# pcbnew maps y -> -y (KiCad's axis grows downward).
#
# Isolation strategy (draft — needs electrical review):
#   * routed slot band at y = 53.5..56.5 plus a full-width copper
#     keepout at y = 52..58 separates the DALI domain (top) from
#     SELV/AUX (bottom)
#   * SOP-4 optocouplers (rot 90) and the TDN-5 SMD isolated DC-DC
#     (pin rows on both long edges) straddle the band; their pads land
#     just outside the keepout on each side and the package body is the
#     creepage barrier over the slot
#   * net-class clearance rules (6 mm) cover the remaining surface paths

fixed:
  # bottom shoulder: KNX bus terminal pins + AUX screw terminal
  J1:  { x: 7.0,  y: 2.5,  rot: 0 }     # KNX terminal pins
  J3:  { x: 21.0, y: 5.5,  rot: 0 }     # AUX screw terminal
  # top shoulder: DALI screw terminal + supply-disable slide switch
  J2:  { x: 8.5,  y: 81.0, rot: 0 }     # DALI terminal
  SW1: { x: 24.0, y: 81.0, rot: 0 }     # slide switch
  # isolation-straddling parts across the slot band
  U3:  { x: 26.0, y: 55.5, rot: 90 }    # TX optocoupler
  U4:  { x: 29.9, y: 55.5, rot: 90 }    # RX optocoupler
  U5:  { x: 15.0, y: 55.0, rot: 0 }     # TDN-5 isolated DC-DC
  # main ICs
  U1:  { x: 10.0, y: 28.0, rot: 0 }     # NCN5130
  C8:  { x: 22.0, y: 40.0, rot: 0 }     # 1000uF storage bulk cap
  # interconnect to the upper board, right edge of the SELV region
  J4:  { x: 28.2, y: 17.0, rot: 270 }

# functional-block packing rectangles: { x, y, w, h } = bottom-left + size
blocks:
  knx_in:      { x: 2.5,  y: 5.5,  w: 15.0, h: 7.0 }   # TVS + polarity diode
  ncn5130:     { x: 2.0,  y: 15.0, w: 7.0,  h: 15.0 }  # fan-in R + analog caps
  buck3v3:     { x: 2.0,  y: 31.5, w: 7.0,  h: 10.0 }  # AP63203 + L + caps
  dcdc1:       { x: 16.0, y: 22.0, w: 8.0,  h: 9.0 }   # L + diode + cap
  dcdc2:       { x: 16.0, y: 31.0, w: 7.0,  h: 9.0 }   # L + diode + fb + 100n
  aux_in:      { x: 17.0, y: 11.0, w: 14.0, h: 9.0 }   # fuse + polarity + TVS + cap
  dali_buck:   { x: 2.0,  y: 59.5, w: 17.0, h: 10.0 }  # LM2574 + L + fb + caps
  dali_tx:     { x: 2.0,  y: 70.0, w: 17.0, h: 9.0 }   # gate R's, zener, FET, BJT, sense
  dali_limit:  { x: 20.0, y: 59.5, w: 10.5, h: 12.0 }  # LM317 + sense R
  dcdc_iso:    { x: 26.0, y: 60.5, w: 4.5,  h: 4.0 }   # output cap
  dali_bridge: { x: 14.0, y: 76.5, w: 10.0, h: 9.0 }   # DF06S
  dali_rx:     { x: 20.0, y: 71.5, w: 10.0, h: 6.0 }   # threshold R + zener + pullup

mounting_holes:
  - { x: 3.0,  y: 3.0 }
  - { x: 28.5, y: 3.0 }
  - { x: 3.0,  y: 83.0 }
  - { x: 28.5, y: 83.0 }

# full-width routed slot under the straddling parts + full-width copper
# keepout; the three bridge components are the creepage barrier
isolation_slot: { x0: 0.5, y0: 53.5, x1: 31.0, y1: 56.5 }
copper_keepout:
  - { x0: 0.0, y0: 52.0, x1: 31.5, y1: 58.0 }

zones:
  - { net: GND,  layer: F.Cu }
  - { net: GND,  layer: B.Cu }
  - { net: GNDD, layer: B.Cu, region: { x0: 0, y0: 58, x1: 31.5, y1: 86 } }
  - { net: GNDA, layer: B.Cu, region: { x0: 14, y0: 0, x1: 31.5, y1: 30 } }
