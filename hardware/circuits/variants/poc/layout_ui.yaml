# POC UI board, 2 layers, in the front protrusion. Footprint-origin
# coordinates in mm, y up from the bottom-left corner, front side unless
# `side: back`. The 0.96" OLED module covers x 1..28.3, y 7.3..35.1 on the
# front and solders into J2 on a 2.5 mm spacer; low SMD parts (<= 2 mm) may sit
# under it.
# J1 (cable to the main board) is on the back, top entry, so the cable
# leaves straight towards the main board.

frame:
  size: { x: 49.5, y: 40.5 }
  copper_layers: 2
  thickness: 1.6
  min_drill: 0.3
  min_track: 0.15
  edge_clearance: 0.3
  fine_pitch_power_pads: [D1, D2, D3]   # power tracks may neck to 0.15 mm into these pads
  domains: [SELV-KNX]
  domain_regions:
    SELV-KNX: { x0: 0.0, y0: 0.0, x1: 49.5, y1: 40.5 }
  isolators: []
  power_nets: [+3V3, +5V]
  pours:
    - { net: GND, layers: [F.Cu, B.Cu], region: { x0: 0.5, y0: 0.5, x1: 49.0, y1: 40.0 } }

# Typical 0.96" SSD1306 I2C module (no manufacturer drawing obtained): board
# 27.3 x 27.8 with the pin row 1.3 mm below its top edge, glass 26.7 x 19.3
# centred, its top edge 4.6 mm below the board's top edge. Measure the module
# before printing the cover.
oled_module:
  outline: { x: 1.0, y: 7.3, w: 27.3, h: 27.8 }
  glass: { x: 1.3, y: 11.2, w: 26.7, h: 19.3 }

# Cover standoffs pressing on the UI board's front (board coordinates).
case:
  standoffs:
    - { x: 2.5,  y: 2.5 }
    - { x: 47.0, y: 2.5 }
    - { x: 2.5,  y: 38.0 }
    - { x: 47.0, y: 38.0 }

zooms:
  controls: { x0: 28.0, y0: 0.0, x1: 49.5, y1: 40.5 }

heights:
  default: 2.0
  J1: 7.5      # BM10B-SRSS-TB 4.25 mm plus the mated plug
  SW1: 7.0
  SW2: 7.0
  D1: 0.65     # SK6805-EC15; light shines through a thin spot in the front wall, one baffle per LED
  D2: 0.65
  D3: 0.65
  J2: 2.5

parts:
  J1:  { x: 24.00, y: 4.00,  rot: 0,  side: back, block: int_main, locked: true }
  J2:  { x: 10.84, y: 33.80, rot: 90, block: oled, locked: true }
  SW1: { x: 40.00, y: 32.00, rot: 0,  block: btn_ladder, locked: true }
  SW2: { x: 40.00, y: 20.00, rot: 0,  block: btn_ladder, locked: true }
  D1:  { x: 34.00, y: 10.00, rot: 0,  block: status_leds, locked: true }
  D2:  { x: 40.00, y: 10.00, rot: 0,  block: status_leds, locked: true }
  D3:  { x: 46.00, y: 10.00, rot: 0,  block: status_leds, locked: true }
  U1:  { x: 26.00, y: 10.00, rot: 0,  block: status_leds }
  C2:  { x: 22.00, y: 9.50,  rot: 90, block: status_leds }
  C3:  { x: 26.00, y: 13.20, rot: 0,  block: status_leds }
  R4:  { x: 29.80, y: 10.00, rot: 0,  block: status_leds }
  C4:  { x: 34.00, y: 13.60, rot: 0,  block: status_leds }
  C5:  { x: 40.00, y: 13.60, rot: 0,  block: status_leds }
  C6:  { x: 46.00, y: 13.60, rot: 0,  block: status_leds }
  C1:  { x: 31.50, y: 37.24, rot: 0,  block: btn_ladder }
  R1:  { x: 35.01, y: 37.24, rot: 0,  block: btn_ladder }
  R2:  { x: 38.51, y: 37.24, rot: 0,  block: btn_ladder }
  R3:  { x: 42.01, y: 37.24, rot: 0,  block: btn_ladder }
