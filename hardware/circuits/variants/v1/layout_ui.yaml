# POC UI board, 2 layers, in the front protrusion. Footprint-origin
# coordinates in mm, y up from the bottom-left corner, front side unless
# `side: back`. The Winstar OLED module covers x 1..28.3, y 7.8..35.1 on the
# front, rests face down in the cover pocket and is soldered into J2 after the
# board snaps in; low SMD parts (<= 2.8 mm) may sit under it.
# J1 (cable to the main board) is on the back, top entry, so the cable
# leaves straight towards the main board.

frame:
  size: { x: 49.5, y: 40.5 }
  copper_layers: 2
  thickness: 1.6
  min_drill: 0.3
  min_track: 0.15
  edge_clearance: 0.3
  fine_pitch_power_pads: [D1, D2, D3]   # power tracks may neck to 0.15 mm into these pads
  domains: [SELV-KNX]
  domain_regions:
    SELV-KNX: { x0: 0.0, y0: 0.0, x1: 49.5, y1: 40.5 }
  isolators: []
  power_nets: [+3V3, +5V]
  pours:
    - { net: GND, layers: [F.Cu, B.Cu], region: { x0: 0.5, y0: 0.5, x1: 49.0, y1: 40.0 } }

# Winstar WEA012864D-03 drawing (p.3): board 27.3 x 27.3, glass substrate
# 26.7 x 19.26 (0.3 from left, 4.02 from top), active display area 21.74 x 10.86
# (2:1 128x64, 2.78 from left, 5.82 from top).
oled_module:
  outline: { x: 1.0,  y: 7.8,   w: 27.3,  h: 27.3 }
  panel:   { x: 1.3,  y: 11.82, w: 26.7,  h: 19.26 }
  glass:   { x: 3.78, y: 18.42, w: 21.74, h: 10.86 }

# Cover standoffs pressing on the UI board's front (board coordinates).
case:
  standoffs:
    - { x: 2.5,  y: 2.5 }
    - { x: 47.0, y: 2.5 }
    - { x: 2.5,  y: 38.0 }
    - { x: 47.0, y: 38.0 }

zooms:
  controls: { x0: 28.0, y0: 0.0, x1: 49.5, y1: 40.5 }

heights:
  default: 2.0
  J1: 7.5      # BM10B-SRSS-TB 4.25 mm plus the mated plug
  SW1: 7.0
  SW2: 7.0
  D1: 0.65     # SK6805-EC15; light shines through a thin spot in the front wall, one baffle per LED
  D2: 0.65
  D3: 0.65
  J2: 2.5

parts:
  J1:  { x: 24.00, y: 4.00,  rot: 0,  side: back, block: int_main, locked: true }
  J2:  { x: 7.54, y: 33.45, rot: 90, block: oled, locked: true }
  # buttons centred on the OLED glass (y 11.82..31.08, centre 21.45), 12 mm apart
  SW1: { x: 40.00, y: 27.45, rot: 0,  block: btn_ladder, locked: true }
  SW2: { x: 40.00, y: 15.45, rot: 0,  block: btn_ladder, locked: true }
  D1:  { x: 34.00, y: 6.00, rot: 0,  block: status_leds, locked: true }
  D2:  { x: 40.00, y: 6.00, rot: 0,  block: status_leds, locked: true }
  D3:  { x: 46.00, y: 6.00, rot: 0,  block: status_leds, locked: true }
  U1:  { x: 26.00, y: 10.00, rot: 0,  block: status_leds }
  C2:  { x: 22.00, y: 9.50,  rot: 90, block: status_leds }
  C3:  { x: 26.00, y: 13.20, rot: 0,  block: status_leds }
  R4:  { x: 29.80, y: 10.00, rot: 0,  block: status_leds }
  C4:  { x: 31.00, y: 3.00, rot: 0,  block: status_leds }
  C5:  { x: 37.00, y: 3.00, rot: 0,  block: status_leds }
  C6:  { x: 43.00, y: 3.00, rot: 0,  block: status_leds }
  C1:  { x: 31.50, y: 37.24, rot: 0,  block: btn_ladder }
  R1:  { x: 35.01, y: 37.24, rot: 0,  block: btn_ladder }
  R2:  { x: 38.51, y: 37.24, rot: 0,  block: btn_ladder }
  R3:  { x: 42.01, y: 37.24, rot: 0,  block: btn_ladder }
