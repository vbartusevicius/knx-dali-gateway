  C17: { x: 15.72, y: 48.50, rot: 0,   block: dali_tx }
  C18: { x: 19.73, y: 48.99, rot: 0,   block: dali_tx }
  D7:  { x: 21.57, y: 56.23, rot: 0,   block: dali_tx }
  D8:  { x: 25.42, y: 52.83, rot: 0,   block: dali_tx }
  Q3:  { x: 15.96, y: 52.27, rot: 0,   block: dali_tx }
  Q4:  { x: 20.45, y: 52.27, rot: 0,   block: dali_tx }
  R14: { x: 23.50, y: 47.24, rot: 0,   block: dali_tx }
  R15: { x: 15.51, y: 46.74, rot: 0,   block: dali_tx }
  R16: { x: 25.30, y: 49.84, rot: 0,   block: dali_tx }

  # AUX domain
  F1:  { x: 37.48, y: 66.53, rot: 0,   side: back, block: aux_fuse }
  D3:  { x: 37.57, y: 66.20, rot: 0,   block: aux_in }
  D4:  { x: 45.07, y: 66.20, rot: 0,   block: aux_in }
  C16: { x: 42.73, y: 67.50, rot: 0,   side: back, block: dcdc_iso }
