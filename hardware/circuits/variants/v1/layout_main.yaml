# POC main board, 4 layers. Footprint-origin coordinates in mm, y up from
# the bottom-left corner, front side unless `side: back`.
#
# Stack-up: F.Cu parts + signals | In1.Cu solid ground | In2.Cu signals +
# ground fill | B.Cu parts + signals. Every copper layer is split into the
# three isolation domains: SELV-KNX (y < 38), DALI (top-left), SELV-AUX
# (top-right).
#
# U1 (NCN5130) is rotated 180 degrees: pins 1-10 (bus side) face J1, pins
# 11-20 (DC1) face the XIAO, pins 21-30 (UART) face the left edge, pins
# 31-40 (crystal, SAVEB, FANIN, VDDA) face the bottom edge.

frame:
  size: { x: 49.5, y: 76.5 }
  copper_layers: 4
  thickness: 1.6
  min_drill: 0.2
  min_track: 0.12   # JLC 4-layer minimum 0.09 mm; Freerouting necks to 0.12 at fine-pitch pins
  edge_clearance: 0.3
  fine_pitch_power_pads: [U1]   # power tracks may neck to 0.15 mm into these pads
  plane_layers: [In1.Cu]
  domains: [SELV-KNX, DALI, SELV-AUX]
  domain_regions:
    SELV-KNX: { x0: 0.0,  y0: 0.0,  x1: 49.5, y1: 43.0 }
    DALI:     { x0: 0.0,  y0: 43.0, x1: 31.0, y1: 76.5 }
    SELV-AUX: { x0: 31.0, y0: 43.0, x1: 49.5, y1: 76.5 }
  isolators: [U3, U4, U5]
  power_nets: [KNX_P, KNX_P_PROT, VFILT, +3V3, +3V3_TRX, +5V, +5V_XIAO, VSW1, VDD1M, SW,
               DA1, DA2, DA_P, DALI_ISO15V, DALI_SUPPLY_SW, AUX_P, AUX_FUSED, N$5]
  slots:
    - { x0: 1.75, y0: 41.0, x1: 7.25, y1: 45.0 }    # under U4, between its pin rows (4 mm, as on the v2 interface)
    - { x0: 9.25, y0: 41.0, x1: 14.75, y1: 45.0 }   # under U5; U3 starts at x 14.8 on the back
  copper_keepout:
    - { x0: 0.5, y0: 40.0, x1: 28.0, y1: 46.0 }
    - { x0: 28.0, y0: 40.0, x1: 34.0, y1: 76.5 }
  pours:
    - { net: GND,  layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 0.5,  y0: 0.5,  x1: 49.0, y1: 39.5 } }
    - { net: GNDD, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 0.5,  y0: 46.5, x1: 27.5, y1: 76.0 } }
    - { net: GNDA, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 34.5, y0: 46.5, x1: 49.0, y1: 76.0 } }

zooms:
  knx: { x0: 0.0, y0: 0.0, x1: 32.0, y1: 24.0 }
  buck: { x0: 18.0, y0: 14.0, x1: 49.5, y1: 38.0 }
  dali: { x0: 0.0, y0: 36.0, x1: 49.5, y1: 76.5 }

# Case contact points (board coordinates). Legs rise from the case floor to the
# back of the board, pegs hang from the cover's shoulder plates onto the front;
# both must stay clear of parts and of soldered pin ends.
case:
  legs:
    - { x: 43.40, y: 2.50, why: KNX plug insertion }
    - { x: 3.00,  y: 3.00, why: bottom-left corner }
    - { x: 14.00, y: 31.00, why: XIAO insertion }
    - { x: 7.00,  y: 68.30, why: DALI terminal screws }
    - { x: 46.50, y: 74.00, why: AUX terminal screws }
  pegs:
    - { x: 3.00,  y: 3.00 }
    - { x: 26.00, y: 1.80 }
    - { x: 27.00, y: 75.50 }

heights:
  default: 2.0
  C4: 16.0
  U3: 10.7
  U7: 14.5      # 8.5 mm sockets + 2.5 mm header plastic + XIAO 3.5 mm (USB-C)
  J1: 9.9
  J2: 10.3
  J3: 10.3
  J4: 7.5      # BM10B-SRSS-TB 4.25 mm plus the mated plug
  JP1: 8.5
  L1: 4.5
  Q1: 2.4
  D5: 2.5

parts:
  # Case-fixed: the terminals' wire-entry faces (rot 180) and the KNX plug's
  # underside are flush with the case's top and bottom faces; UI connector,
  # supply jumpers, XIAO, storage capacitor, isolators
  J1:  { x: 40.50,  y: 7.25,   rot: 0,   block: knx_in, locked: true }
  J2:  { x: 41.00,  y: 74.75, rot: 180, block: aux_in, locked: true }
  J3:  { x: 9.50,   y: 74.75, rot: 180, block: dali_terminal, locked: true }
  J4:  { x: 43.00,  y: 21.50, rot: 90,  block: int_ui, locked: true }
  JP1: { x: 20.73,  y: 72.27, rot: 0,   block: dali_switch, locked: true }
  U7:  { x: 14.00,  y: 28.00, rot: 0,   block: mcu, locked: true }
  C4:  { x: 39.63,  y: 30.00, rot: 0,   side: back, block: storage, locked: true }
  U3:  { x: 44.97,  y: 46.38, rot: 90,  side: back, block: dcdc_iso, locked: true }
  U4:  { x: 4.50,   y: 43.00, rot: 90,  side: back, block: dali_tx_led, locked: true }
  U5:  { x: 12.00,  y: 43.00, rot: -90, side: back, block: dali_rx, locked: true }

  # KNX input: protection between J1 and U1 bus pins
  D2:  { x: 32.50, y: 5.40,  rot: 180, block: knx_in }
  D1:  { x: 32.50, y: 9.80,  rot: 0,   block: knx_in }

  # NCN5130 and its datasheet Table 6 parts, each next to its pin
  U1:  { x: 11.00, y: 11.00, rot: 180, block: ncn5130 }
  C3:  { x: 15.10, y: 12.00, rot: 90,  side: back, block: ncn5130 }
  C2:  { x: 18.50, y: 9.20,  rot: 0,   block: ncn5130 }
  C1:  { x: 15.80, y: 10.60, rot: 270, block: ncn5130 }
  R3:  { x: 20.60, y: 3.40,  rot: 180, block: ncn5130 }
  C5:  { x: 15.40, y: 6.60,  rot: 0,   block: ncn5130 }
  C15: { x: 12.20, y: 16.20, rot: 0,   block: ncn5130 }
  R4:  { x: 7.20,  y: 16.60, rot: 90,  block: ncn5130 }
  C7:  { x: 4.90,  y: 16.80, rot: 270, block: ncn5130 }
  L1:  { x: 12.00, y: 20.60, rot: 90,  side: back, block: ncn5130 }
  C6:  { x: 6.20,  y: 7.90,  rot: 270, block: ncn5130 }
  R9:  { x: 4.60,  y: 11.20, rot: 0,   block: ncn5130 }
  Y1:  { x: 10.60, y: 3.90,  rot: 180, block: ncn5130 }
  C8:  { x: 13.60, y: 3.40,  rot: 270, block: ncn5130 }
  C9:  { x: 6.90,  y: 3.40,  rot: 180, block: ncn5130 }
  R1:  { x: 12.60, y: 5.60,  rot: 0,   side: back, block: ncn5130 }
  R2:  { x: 9.00,  y: 5.60,  rot: 0,   side: back, block: ncn5130 }

  # 5 V buck from VFILT and the XIAO feed
  U2:  { x: 29.00, y: 21.00, rot: 0,   block: buck5v }
  C11: { x: 32.20, y: 20.00, rot: 270, block: buck5v }
  L2:  { x: 34.60, y: 25.60, rot: 0,   block: buck5v }
  C10: { x: 30.60, y: 23.90, rot: 0,   block: buck5v }
  C12: { x: 37.40, y: 21.00, rot: 270, block: buck5v }
  C13: { x: 38.60, y: 24.80, rot: 270, block: buck5v }
  C14: { x: 37.40, y: 17.60, rot: 270, block: buck5v }
  R5:  { x: 25.00, y: 24.60, rot: 90,  block: buck5v }
  R6:  { x: 23.40, y: 24.60, rot: 90,  block: buck5v }
  R7:  { x: 27.60, y: 25.00, rot: 90,  block: buck5v }
  R8:  { x: 28.20, y: 27.60, rot: 0,   block: buck5v }
  U6:  { x: 24.40, y: 21.20, rot: 0,   block: mcu_power }
  C19: { x: 24.40, y: 18.80, rot: 0,   block: mcu_power }
  R20: { x: 25.50, y: 29.25, rot: 0,   block: mcu }
  R21: { x: 30.20, y: 29.25, rot: 0,   block: mcu }

  # SELV side of the DALI optocouplers
  R12: { x: 3.50,  y: 25.25, rot: 0,   block: dali_tx_led }
  R13: { x: 3.50,  y: 23.25, rot: 0,   block: dali_tx_led }
  R19: { x: 3.50,  y: 28.25, rot: 0,   block: dali_rx_selv }

  # DALI domain
  D5:  { x: 8.00,  y: 60.00, rot: 90,  block: dali_bridge }
  D6:  { x: 16.00, y: 58.02, rot: 90,  block: dali_bridge }
  Q1:  { x: 8.84,  y: 61.07, rot: 0,   side: back, block: dali_limit }
  Q2:  { x: 3.96,  y: 55.27, rot: 0,   side: back, block: dali_limit }
  R10: { x: 8.80,  y: 55.84, rot: 0,   side: back, block: dali_limit }
  R11: { x: 13.01, y: 56.24, rot: 0,   side: back, block: dali_limit }
  D9:  { x: 4.42,  y: 48.83, rot: 0,   block: dali_rx }
  Q5:  { x: 3.60,  y: 52.27, rot: 0,   block: dali_rx }
  Q6:  { x: 10.40, y: 52.27, rot: 180, block: dali_rx }
  R17: { x: 9.01,  y: 49.24, rot: 0,   block: dali_rx }
