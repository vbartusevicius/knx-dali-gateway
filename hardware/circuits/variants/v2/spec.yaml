      SELV-KNX:
      - GND
      - +3V3_TRX
      - +5V
      - KNX_P
      - KNX_P_PROT
      - KNX_TXD
      - KNX_RXD
      - NCN_SAVEB
      - VFILT
      - CCP
      - CAV
      - CEQ1
      - CEQ2
      - VSW1
      - VDD1M
      - Net-*
      KNX-Power:
      - KNX_P
      - KNX_P_PROT
      - VFILT
      SELV-AUX:
      - GNDA
      - AUX_P
      - AUX_FUSED
      DALI:
      - GNDD
      - DA1
      - DA2
      - DA_P
      - DALI_GATE
      - DALI_GATE_SW
      - DALI_SENSE
      - DALI_BOOT
      - DALI_ISO15V
      - DALI_SUPPLY_SW
      - RX_LIM_IN
    interface:
      SELV-KNX:
      - GND
      - +3V3
      - DALI_TX
      - DALI_RX
      DALI:
      - GNDD
      - DA1
      - DA2
      - DA_P
    ui:
      SELV-KNX:
      - '*'
