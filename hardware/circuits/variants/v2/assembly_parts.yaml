# V2 parts that belong to the assembly but sit on no board's JLC BOM.
# Hand-fit board parts (XIAO, RECOM, KNX pin strip, C4, OLED) are in each
# board's <board>_hand_fit.csv. Copied by release.py as assembly_parts.csv.
- item: Main-to-UI cable
  qty: 1
  part: JST A10SR10SR30K102A
  description: "SH 1.0 mm 10-position jumper, 101.6 mm, 1:1 (pin 1 to pin 1); main J4 to UI J1, carries KNX UART, DALI TX/RX and power"
  source: Digi-Key / Mouser (not stocked at LCSC); any 1:1 SH 10P cable of 80-150 mm works
- item: KNX bus plug
  qty: 1
  part: Phoenix Contact PTS 0,5/ 2-PH-5,75 BKRD (1574300)
  description: "red/black KNX bus connector mating the PST 1,0/2-5,75 pin strip (main J1); WAGO 243-211 is for 0.8 mm pins and does not fit"
  source: Phoenix Contact distributors
- item: XIAO sockets
  qty: 2
  part: PM2.54-1x7PZZ-H8.5 (LCSC C54876729)
  description: "1x7 female header, 2.54 mm, 8.5 mm tall, soldered into UI U2 (back of the UI board); the XIAO stays detachable"
  source: LCSC
- item: DALI supply jumper caps
  qty: 2
  part: LCSC C100114
  description: "2.54 mm closed jumper cap, 3 A; both on main JP1 = internal DALI supply on, both off for an external DALI supply"
  source: LCSC
- item: Case screws
  qty: 2
  part: "2.5 x 10 mm thread-forming screw for plastics, pan head (e.g. EJOT PT K25x10 or Wuerth WUEPLAST 2.5x10)"
  description: "through the top and bottom walls (the wire sides) into the cover's screw tabs (2.2 mm pilot)"
  source: any
- item: Case base
  qty: 1
  part: enclosure/base.stl
  description: "PETG or ASA, 0.2 mm layers, rail channel face down; carries the main board, the interface board plugged onto it and the C4 cradles"
  source: printed
- item: Case cover
  qty: 1
  part: enclosure/cover.stl
  description: "PETG or ASA, 0.2 mm layers, front face down; carries the OLED (in its pocket) and the UI board (snap hooks)"
  source: printed
