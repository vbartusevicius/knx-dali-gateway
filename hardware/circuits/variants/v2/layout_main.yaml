frame:
  size: { x: 31.5, y: 76.5 }
  copper_layers: 4
  prune_ground_tracks: false
  thickness: 1.6
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  fine_pitch_power_pads: [U1, Q2, U10]
  plane_layers: [In1.Cu]
  domains: [SELV-KNX, DALI, SELV-AUX]
  domain_regions:
    SELV-KNX:
      - { x0: 0.0, y0: 0.0,  x1: 31.5, y1: 29.25 }
      - { x0: 5.9, y0: 29.25, x1: 31.5, y1: 35.6 }   # U9 output pins 3/5
    SELV-AUX:
      - { x0: 1.4, y0: 32.85, x1: 5.35, y1: 37.5 }   # U9 input pins 1/2
      - { x0: 0.0, y0: 37.5, x1: 21.0, y1: 52.0 }
      - { x0: 0.0, y0: 52.0, x1: 11.5, y1: 68.0 }
      - { x0: 0.0, y0: 68.0, x1: 15.5, y1: 76.5 }
    DALI:
      - { x0: 27.0, y0: 41.0, x1: 31.5, y1: 55.0 }
      - { x0: 16.5, y0: 55.0, x1: 31.5, y1: 68.0 }
      - { x0: 21.5, y0: 68.0, x1: 31.5, y1: 76.5 }
  isolators: [U3, U4, U9]
  power_nets: [KNX_P, KNX_P_PROT, VFILT, +3V3, +3V3_TRX, +5V, +5V_BUCK, +5V_AUX, VSW1, VDD1M, SW,
               DA1, DA2, DALI_ISO15V, DALI_SUPPLY_SW, AUX_P, AUX_FUSED]
  slots:
    - { x0: 17.0, y0: 34.8, x1: 20.0, y1: 38.6 }
    - { x0: 5.5,  y0: 32.1, x1: 6.5,  y1: 35.1 }    # U9 pins 2 | 3: creepage path past 2 mm
  copper_keepout:
    - { x0: 8.4,  y0: 35.6, x1: 21.0, y1: 37.5 }    # SELV-KNX | SELV-AUX (2 mm)
    - { x0: 0.5,  y0: 29.25, x1: 6.65, y1: 32.85 }  # SELV-KNX | U9 input pins: AUX leaves pins 1/2 upwards (2 mm)
    - { x0: 5.35, y0: 32.85, x1: 6.65, y1: 37.5 }   # U9 input | output pins (2 mm between their tracks)
    - { x0: 6.65, y0: 34.35, x1: 14.5, y1: 35.6 }   # SELV-AUX | U9 output pins: KNX leaves pins 3/5 downwards
    - { x0: 6.65, y0: 35.6, x1: 8.4,  y1: 37.5 }
    - { x0: 0.5,  y0: 32.85, x1: 1.4, y1: 37.5 }
    - { x0: 21.0, y0: 35.5, x1: 31.0, y1: 41.5 }    # SELV-KNX | DALI (6 mm)
    - { x0: 21.0, y0: 41.5, x1: 27.0, y1: 54.0 }    # SELV-AUX | DALI vertical (6 mm)
    - { x0: 10.5, y0: 48.0, x1: 27.0, y1: 54.0 }    # SELV-AUX | DALI under U3 (6 mm)
    - { x0: 10.5, y0: 54.0, x1: 17.0, y1: 68.0 }    # SELV-AUX | DALI upper-mid (6.5 mm)
    - { x0: 15.5, y0: 68.0, x1: 21.5, y1: 76.0 }    # SELV-AUX | DALI at top terminals (6 mm)
  pours:
    - { net: GND,  layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 0.5,  y0: 0.5,  x1: 31.0, y1: 28.95 } }
    - { net: GND,  layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 8.7,  y0: 28.7, x1: 31.0, y1: 33.8 }, priority: 1 }
    - { net: GNDA, layers: [In1.Cu], region: { x0: 1.7,  y0: 33.0, x1: 4.6, y1: 37.8 }, priority: 1 }
    - { net: GNDA, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 0.5,  y0: 39.8, x1: 20.5, y1: 47.7 } }
    - { net: GNDA, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 0.5,  y0: 47.8, x1: 10.2, y1: 67.8 } }
    - { net: GNDA, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 0.5,  y0: 67.9, x1: 10.2, y1: 76.0 } }
    - { net: GNDD, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 27.3, y0: 41.8, x1: 31.0, y1: 54.2 } }
    - { net: GNDD, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 17.3, y0: 54.3, x1: 31.0, y1: 67.8 } }
    - { net: GNDD, layers: [F.Cu, In1.Cu, In2.Cu, B.Cu], region: { x0: 21.8, y0: 67.9, x1: 31.0, y1: 73.4 } }

