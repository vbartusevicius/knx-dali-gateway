# V3 KNX board, 4 layers, 1.2 mm, horizontal above the inputs shelf
# (enclosure y 27.0-28.2). x along the depth (0 = rail side, enclosure z 2.1;
# 28.4 = enclosure z 30.5), y across the module from the carrier face (0) to
# the far side wall (12.5). Top faces up. Rail end: crystal and NCN5130 with
# its small parts kept off the pin rows (fine-pitch escapes); front end: L1
# beside J1, the 8-pin 0.5 mm FFC to the carrier (cable towards y 0).
# Underneath: storage capacitor under the NCN5130 (1.3 mm above the inputs
# shelf's parts), the rest towards the front. The 5 V buck lives on the
# carrier. Pure SELV-KNX.

frame:
  size: { x: 28.4, y: 12.5 }
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true   # references placed on the board next to their parts, hidden if nothing fits
  fine_pitch_power_pads: [U1]
  plane_layers: [In1.Cu]
  domains: [SELV-KNX]
  domain_regions:
    SELV-KNX: { x0: 0.0, y0: 0.0, x1: 28.4, y1: 12.5 }
  isolators: []
  power_nets: []    # <= 150 mA everywhere on this board: 0.2 mm tracks are enough
  pours:
    - { net: GND, layers: [In1.Cu], region: { x0: 0.5, y0: 0.5, x1: 27.9, y1: 12.0 } }

# NCN5130 ground pins join the exposed pad straight along their own axis, at
# the pin width, before routing (no necked-down ground stubs between pins)
pad_ties: { U1: 41 }
# and every other connected NCN5130 pin fans out 0.3 mm along its own axis first
# (on the crystal side only the crystal pins 34/35 get stubs: the others need
# the narrow gap to the crystal for their vias)
pad_escapes: { U1: { length: 0.3, skip: [31, 32, 33, 36, 37, 38, 39, 40] } }

heights:
  default: 1.0
  C4: 10.5
  L1: 4.5
  J1: 1.2

parts:
  J1:  { x: 23.6,  y: 2.8,    rot: 180, block: int_main, locked: true }
  U1:  { x: 8.0,   y: 7.0,   rot: 90,  block: ncn5130 }
  Y1:  { x: 2.0,   y: 7.0,   rot: 90,  block: ncn5130 }
  C8:  { x: 2.0,   y: 3.4,   rot: 0,   block: ncn5130 }
  C9:  { x: 2.0,   y: 10.6,  rot: 0,   block: ncn5130 }
  C5:  { x: 4.2,   y: 1.4,   rot: 0,   block: ncn5130 }
  C6:  { x: 5.0,   y: 11.55, rot: 0,   block: ncn5130 }
  R5:  { x: 13.6,  y: 11.55, rot: 0,   block: ncn5130 }
  R4:  { x: 16.8,  y: 11.55, rot: 0,   block: ncn5130 }
  C1:  { x: 14.6,  y: 1.4,   rot: 0,   block: ncn5130 }
  C2:  { x: 17.6,  y: 5.0,   rot: 90,  block: ncn5130 }
  L1:  { x: 23.6,  y: 9.0,   rot: 0,   block: ncn5130 }

  C4:  { x: 6.5,   y: 7.1,   rot: 0,   side: back, block: storage, locked: true }
  R3:  { x: 18.6,  y: 9.8,   rot: 0,   side: back, block: ncn5130 }
  C7:  { x: 14.9,  y: 6.0,   rot: 0,   side: back, block: ncn5130 }
  C10: { x: 18.6,  y: 6.0,   rot: 0,   side: back, block: ncn5130 }
  C3:  { x: 10.6,  y: 1.4,   rot: 0,   block: ncn5130 }
  R1:  { x: 25.8,  y: 6.0,   rot: 0,   side: back, block: ncn5130 }
  R2:  { x: 13.8,  y: 9.8,   rot: 90,  side: back, block: ncn5130 }
