active_variant: v3
product:
  revision: C
  release: v3
  status: draft-unvalidated

din_envelope:
  modules: 1
  max_board_width_inside: 13.8
  front_board_max: { width: 13.8, height: 40.5, depth: 15.0 }

variants:
  v3:
    description: "1 DIN, two-sided vertical main board + front UI board"
    modules: 1
    boards: [main, ui]

terminals:
  dali:
    board: main
    shoulder: top
    poles: 2
    pitch: 5.75
    type: knx-style push-in plug (Phoenix PTS 0,5/2-PH-5,75 on PST 1,0 pin strip)
    labels: [DA, DA]
  aux_dc:
    board: main
    shoulder: bottom
    poles: 2
    pitch: 5.75
    type: knx-style plug, yellow/white (Phoenix PTS 0,5/2-PH-5,75 GY35YE)
    labels: [AUX+, AUX-]  # 20-32 V; powers only the internal DALI supply
  knx:
    board: main
    shoulder: bottom
    type: knx-bus-terminal-pins   # red/black plug (Phoenix PTS 0,5/2-PH-5,75 BKRD)
    labels: [KNX+, KNX-]

boards:
  main:
    plane: perpendicular-to-rail   # board x = 41.9 - enc_z, board y = enc_y - 1.5, front faces +enc_x
    thickness: 1.2
    x: -4.2                        # front face (back face at -5.4; 2.0 mm to left wall for THT tails + back SMDs)
    y_offset: 1.5
    z_front: 41.9
    max_outline: { width: 39.8, height: 78.0 }
    isolation:
      - { between: [SELV-KNX, DALI], creepage_min: 6.0, bridged_by: [optocouplers] }
      - { between: [SELV-AUX, DALI], creepage_min: 6.0, bridged_by: [REM3] }
      - { between: [SELV-KNX, SELV-AUX], creepage_min: 2.0, bridged_by: [supply-off optocoupler] }
  ui:
    plane: parallel-to-front
    thickness: 1.2
    z: 55.4
    max_outline: { width: 13.8, height: 40.5 }
  interconnects:
    - from: main
      to: ui
      signals: [+3V3, GND, BTN_LADDER, LED_DATA, +5V, I2C_SDA, I2C_SCL, GND]
      refs: { main: J4, ui: J1 }
      domain: SELV-KNX
      type: ffc
      pins: 8

front_ui:
  board_z: 54.19
  board_top_z: 55.39
  oled:
    header_gap: 4.06      # CFAL12832D-B total 1.45 (board 0.45 + panel 1.00); glass at 60.9
    module_board: 0.45
    panel: 1.00
    header_plastic_max: 2.5
    pin_tail: 24.99
  buttons:
    - { id: prg_rst, label: PRG/RST, actuator: tactile-TS-1088+plunger, actuator_length_mm: 7.0, protrusion_beyond_front: 1.4 }
    - { id: func, label: FUNC, actuator: tactile-TS-1088+plunger, actuator_length_mm: 7.0, protrusion_beyond_front: 1.4 }
  display:
    type: oled-0.96in-64x128-ssd1312-i2c-hotbar14
    part: QG-6428TSWCG02 / JLX12864OLED-S096W / NFP1312-15AY (14.0 x 28.0 x 1.22 mm, 14-pin 0.62 mm solder FPC)
    geometry: hardware/circuits/variants/v3/layout_ui.yaml oled_module

enclosure:
  shoulder_z: 44.0
  screw_tabs: []

mcu:
  board: main
  mounting: "2 x 7 female 2.54 mm headers, 5.0 mm height (+ 2.5 mm pin header plastic + 3.5 mm XIAO = 11.0 mm); 5 V buck and passives underneath"

