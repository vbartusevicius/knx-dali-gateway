# V3 DALI board, 4 layers, 1.2 mm, parallel to the front (enclosure x -5.1..6.9,
# y 33.2..78.9, z 26.0..27.2; 12.0 x 45.7 mm, 0.6 mm off the carrier face).

frame:
  size: { x: 12.0, y: 45.7 }
  copper_layers: 4
  thickness: 1.2
  min_drill: 0.2
  min_track: 0.12
  edge_clearance: 0.3
  silk_inside: true
  fine_pitch_power_pads: [J2, J3]
  plane_layers: [In1.Cu]
  domains: [SELV-KNX, DALI]
  domain_regions:
    SELV-KNX: { x0: 0.0, y0: 0.0,  x1: 12.0, y1: 9.0 }
    DALI:     { x0: 0.0, y0: 15.0, x1: 12.0, y1: 45.7 }
  isolators: [U1, U2]
  power_nets: [+3V3, DA1, DA2, DA_P, DALI_BOOT, DALI_SENSE]
  slots:
    - { x0: 1.6, y0: 10.0, x1: 4.6, y1: 14.0 }
    - { x0: 7.4, y0: 10.0, x1: 10.4, y1: 14.0 }
  copper_keepout:
    - { x0: 0.5, y0: 9.0, x1: 11.5, y1: 15.0 }
  pours:
    - { net: GND,  layers: [In1.Cu], region: { x0: 0.5, y0: 0.5,  x1: 11.5, y1: 8.7 } }
    - { net: GNDD, layers: [In1.Cu], region: { x0: 0.5, y0: 15.3, x1: 11.5, y1: 45.2 } }

heights:
  default: 2.0
  J1: 12.75
  J2: 1.2
  J3: 1.2
  D1: 2.5

parts:
  J1:  { x: 9.05,  y: 39.8,  rot: 180, block: dali_terminal, locked: true }
  U1:  { x: 3.1,   y: 12.0,  rot: 90,  block: dali_tx_led, locked: true }
  U2:  { x: 8.9,   y: 12.0,  rot: -90, block: dali_rx, locked: true }
  J2:  { x: 6.0,   y: 2.2,   rot: 0,   block: int_logic, locked: true }
  R1:  { x: 2.0,   y: 5.2,   rot: 0,   block: dali_tx_led }
  R2:  { x: 5.2,   y: 5.2,   rot: 0,   block: dali_tx_led }
  R8:  { x: 9.4,   y: 5.2,   rot: 0,   block: dali_rx_selv }
  D3:  { x: 3.8,   y: 19.6,  rot: 0,   block: dali_tx }
  C1:  { x: 9.5,   y: 19.6,  rot: 0,   block: dali_tx }
  R3:  { x: 1.8,   y: 22.8,  rot: 0,   block: dali_tx }
  R4:  { x: 5.0,   y: 22.8,  rot: 0,   block: dali_tx }
  D4:  { x: 9.2,   y: 22.6,  rot: 0,   block: dali_tx }
  Q1:  { x: 2.2,   y: 26.2,  rot: 0,   block: dali_tx }
  R5:  { x: 5.4,   y: 26.6,  rot: 90,  block: dali_tx }
  Q2:  { x: 9.0,   y: 26.2,  rot: 0,   block: dali_tx }

  J3:  { x: 7.3,   y: 42.6,  rot: 0,   side: back, block: int_bus, locked: true }
  D2:  { x: 2.0,   y: 37.0,  rot: 90,  side: back, block: dali_bridge }
  D1:  { x: 6.2,   y: 20.0,  rot: 0,   side: back, block: dali_bridge }
  D5:  { x: 9.4,   y: 26.8,  rot: 0,   side: back, block: dali_rx }
  Q3:  { x: 4.8,   y: 26.8,  rot: 0,   side: back, block: dali_rx }
  Q4:  { x: 9.2,   y: 30.8,  rot: 0,   side: back, block: dali_rx }
  R6:  { x: 5.0,   y: 30.2,  rot: 0,   side: back, block: dali_rx }
  R7:  { x: 5.0,   y: 32.0,  rot: 0,   side: back, block: dali_rx }
