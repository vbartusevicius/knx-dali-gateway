# Shared defaults for the PCBs and the 3D-printed DIN enclosure. Every variant
# (hardware/circuits/variants/<variant>/spec.yaml, v2 and v3) is merged over this
# file by hardware/circuits/product_spec.py; the variant sets active_variant,
# product revision/release and everything that differs.
# Units: millimetres. Coordinate system (installed device, viewed from the front):
#   x = width (left -> right), y = height (bottom -> top), z = depth (rail face = 0 -> front).
# Generators (SKiDL/KiCad PCB scripts and the CadQuery enclosure) read the merged spec;
# the fit tests compare the generated PCBs against the generated enclosure.

product:
  name: KNX DALI Gateway
  status: draft-unvalidated

# Envelope per user measurement (authoritative — see hardware/docs/din-envelope.svg
# and hardware/docs/variants.md). Per module: 18 mm wide. Hidden part under
# the distribution-board cover: 81 H x 44 D (rail already excluded). Front
# protrusion: 45 H x 17 D, centred -> 18 mm shoulders above and below.
# Shoulders are NOT only for terminals: terminals take ~one module width,
# the rest is normal component space.
din_envelope:
  module_width: 18.0
  module_pitch: 18.0       # 3 modules = 54 mm total width
  modules: 3
  hidden_part: { height: 81.0, depth: 44.0 }   # rail face excluded
  front_protrusion: { height: 45.0, depth: 17.0, depth_start: 44.0 }
  shoulder_height: 18.0    # (81 - 45) / 2
  max_board_width_inside: 49.5    # 3 x 18 - 2 x 1.6 wall - 2 x 0.5 clearance
  max_board_height_inside: 76.5    # 81 - 2 x 1.6 - 2 x 0.5
  front_board_max: { width: 49.5, height: 40.5, depth: 15.0 }
  rail: TS35

enclosure:
  material: PETG-or-ASA  # printed prototype; not installation-rated until reviewed
  wall: 1.6
  min_clearance_to_pcb: 0.5
  shoulders: 1.3 mm above the tallest connector (mechanical/scripts/enclosure_features.py)
  connector_faces: flush with the top (terminal wire entries) and bottom (KNX plug) faces
  board_retention: legs-and-pegs # main board on base legs, clamped by cover pegs; UI board on cover standoffs + ledges
  fasteners: "2 x thread-forming screws 2.5 x 10 (PT-style, pan head) through the top and bottom walls into screw tabs on the cover"
  rail_mount: "TS35 channel (35.4 between hooks, EN 60715) in a 5 mm deep back; fixed top hook, sprung sliding latch whose tab sticks out below the case: screwdriver into its hole from the front, pull down"
  screw_terminal_access: front   # screwdriver holes in the top shoulder
  wire_entry: top                # terminal wire-entry faces sit in openings in the top wall
  parts: [base, cover]

boards:
  main:                  # parallel to the rail; front side faces the cover
    plane: parallel-to-front
    thickness: 1.6
    z: 21.2               # board top; storage capacitor (16 mm) 2 mm above the floor; mated KNX plug top 32.7, 1.3 mm below the shoulder face
    max_outline: { width: 49.5, height: 76.5 }
    domains:
      SELV-KNX: bottom   # KNX terminal, NCN5130, storage, 3V3 buck, XIAO, UI connector
      DALI: top          # DALI terminal, bridge, TX sink, RX threshold, supply output
      SELV-AUX: top-right corner next to DALI   # aux terminal, protection, DC-DC primary
    isolation:
      - { between: [SELV-KNX, DALI], creepage_min: 6.0, bridged_by: [optocouplers] }
      - { between: [SELV-AUX, DALI], creepage_min: 6.0, bridged_by: [isolated DC-DC] }
      - { between: [SELV-KNX, SELV-AUX], creepage_min: 2.0, note: "both SELV; kept separate so the KNX bus stays floating" }
    side_assignment:
      front: "terminals (screws face front), XIAO on female headers, optos, small parts"
      rear: "tall parts toward rail — storage cap, isolated DC-DC, pass transistor with copper pour"
  ui:                    # in the protrusion, parallel to the front at z~57
    plane: parallel-to-front
    thickness: 1.6
    z: 57.0
    max_outline: { width: 49.5, height: 40.5 }
  interconnects:
    - { from: main, to: ui, signals: [+3V3, GND, GND, BTN_LADDER, GND, LED_DATA, +5V, LED_DALI, I2C_SDA, I2C_SCL], domain: SELV-KNX, type: cable, pins: 10, connector_pitch: 1.0 }

terminals:
  dali:
    board: main
    shoulder: top        # DALI (treated as non-SELV)
    poles: 2
    pitch: 5.0
    type: screw
    labels: [DA, DA]
  aux_dc:
    board: main
    shoulder: top        # next to DALI, separated by the AUX/DALI isolation band
    poles: 2
    pitch: 5.0
    type: screw
    labels: [AUX+, AUX-]  # 20-32 V (24 V PSU or MDT 30 V); internal DALI supply and the AUX core converter
  dali_supply_switch:
    board: main
    shoulder: top
    type: jumpers         # JP1, two jumper caps enable the internal DALI supply; remove both for an external one
  knx:
    board: main
    shoulder: bottom
    type: knx-bus-terminal-pins   # red/black plug-in KNX bus terminal on 1.0 mm pins
    labels: [KNX+, KNX-]

front_ui:                # on the 45 mm x width front face, mounted on the UI board
  # Stack-up computed by mechanical/scripts/ui_stackup.py (test_ui_stackup checks these values):
  #   front outer z = 61.0, wall 1.6
  #   board z = 53.8, board top = 55.4
  #   OLED glass top = 60.9 (flush, panel through the window, module board in a 0.4 mm pocket)
  #   PRG/RST and FUNC caps at 62.4 (1.4 mm proud, finger-operated), actuator 7.0 mm
  #   SMD RGB LEDs on the board shine through a 0.6 mm skin of the front wall, one baffle tube each
  board_z: 53.8
  board_top_z: 55.4
  oled:
    header_gap: 3.13      # UI board top to module back; keeps the UI board where the 7 mm buttons need it
    module_board: 1.0
    panel: 1.37
    header_plastic_max: 2.5
    pin_tail: 6.0
  buttons:
    - { id: prg_rst, label: PRG/RST, actuator: tactile-PTS645SL70, actuator_length_mm: 7.0, protrusion_beyond_front: 1.4,
        tap: reboot (ESP32 + KNX stack, configuration kept), hold_5s: KNX programming mode on/off }
    - { id: func, label: FUNC, actuator: tactile-PTS645SL70, actuator_length_mm: 7.0, protrusion_beyond_front: 1.4,
        tap: next display page / wake the display, hold_5s: WiFi setup }
    - { id: both, hold_10s: factory reset (KNX, lighting and WiFi configuration) }
  leds:   # SK6805-EC15 chain on LED_DATA; always lit, colours in gateway/src/device/StatusLeds.cpp
    - { id: status, ref: D1, shows: "green healthy, blue blink WiFi connected, amber degraded, red fault, blue blinking WiFi setup" }
    - { id: knx, ref: D2, shows: "dim green idle, green traffic, red programming mode, red blinking no bus" }
    - { id: dali, ref: D3, shows: "dim green idle, green our frames, cyan other masters, amber gear fault, red no power, red blinking short, blue commissioning" }
  display:
    type: oled-0.96in-ssd1306-i2c   # populated; glass flush with the front
    part: Winstar WEA012864DWPP3N00003 (WEA012864D-03 drawing)
    geometry: hardware/circuits/variants/v2/layout_ui.yaml oled_module
  labels_area: true

mcu:
  module: "Seeed XIAO ESP32C6"
  package: "21 x 17.8 mm, 14 edge pads (2x7, 2.54 mm pitch, 15.24 mm row spacing)"
  mounting: "2 x 7 female 2.54 mm headers, raised ~8.5 mm; passives allowed underneath (height <= 6 mm)"
  power_feed: "5V pin via TI LM66100 ideal diode from KNX 5V buck; XIAO onboard regulator outputs 3V3 for our logic (optos, LEDs, OLED, pull-ups)"

checks:
  hole_to_actuator_max_offset: 0.3
  led_to_window_max_offset: 0.3
  terminal_axis_to_access_hole_max_offset: 0.4
  component_to_wall_min_gap: 0.5
  component_to_cover_min_gap: 0.5
  component_air_gap: 2.0    # air between parts and the case (connectors that reach openings excepted)
  board_to_board_component_gap: 1.0
  dali_to_selv_creepage_min: 6.0

rejected_variants:
  din2_three_boards:     # 2 modules: main (vertical) + power (vertical) + ui (front)
    result: rejected after the DALI-area shrink, SMD optocouplers and one routing run
    evidence:
      main_board: 36 x 86 mm, 2-layer, NCN5130 QFN-40 0.5 mm + ESP32 module + USB-C + 6 mm isolation band
      courtyard_utilisation: { SELV_back: 0.66, SELV_front: 0.49, isolation_band: 0.96, DALI_back: 0.73 }
      freerouting: 30 unconnected pads, 146 DRC violations (2026-10-11 10:31 run)
