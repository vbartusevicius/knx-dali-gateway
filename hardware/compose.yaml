#
# EDA/CAD toolchain for the hardware slice. Every step runs in a pinned
# container; hardware/scripts/build.sh orchestrates them.
services:
  eda:
    build:
      context: .
      dockerfile: docker/Dockerfile.eda
    # kicad/kicad publishes amd64 images only (checked 2026-10: manifest
    # list has no arm64 variant). Emulation is required on Apple Silicon.
    platform: linux/amd64
    user: root
    volumes:
      - ..:/work
    working_dir: /work

  router:
    build:
      context: .
      dockerfile: docker/Dockerfile.router
    volumes:
      - ..:/work
    working_dir: /work

  cad:
    build:
      context: .
      dockerfile: docker/Dockerfile.cad
    volumes:
      - ..:/work
    working_dir: /work
