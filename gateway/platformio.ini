[platformio]
default_envs = dev_c6
test_dir = tests

[env]
build_unflags = -std=gnu++11 -std=gnu++23
build_flags = -std=gnu++17
extra_scripts = post:scripts/compiledb.py

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = yes
test_filter = unit/*
build_src_filter = +<*> -<firmware/> -<knxstack/> -<lab/> -<espidf/RmtDaliBus.cpp>
build_flags = ${env.build_flags} -Isrc
build_src_flags = -Wall -Wextra -Werror
lib_deps =
    throwtheswitch/Unity@2.6.1
    symlink://tests/support/sdk_fakes

[env:native_sanitized]
extends = env:native
build_flags = ${env:native.build_flags} -fsanitize=address,undefined -fno-omit-frame-pointer

[env:dev_c6]
platform = platformio/espressif32@6.12.0
platform_packages =
    platformio/framework-espidf@3.50500.0
    platformio/toolchain-riscv32-esp@14.2.0+20241119
    platformio/tool-esptoolpy@2.40900.250804
    platformio/tool-cmake@3.30.2
    platformio/tool-ninja@1.13.2
framework = espidf
board = esp32-c6-devkitc-1
build_type = debug
monitor_speed = 115200
build_flags = ${env.build_flags} -DMASK_VERSION=0x07B0 -DKNX_NO_AUTOMATIC_GLOBAL_INSTANCE -DKNX_FLASH_SIZE=8192 -Wno-unknown-pragmas -Wno-error=volatile
lib_deps = https://github.com/thelsing/knx.git#980c047ad7fc5e27bf2fae95e48acde5d5e0b4fd
board_build.esp-idf.sdkconfig_path = .pio/build/${this.__env__}/sdkconfig

[env:release_c6]
extends = env:dev_c6
build_type = release

; Integration-lab build: the real gateway application on the thelsing
; LinuxPlatform with KNXnet/IP (mask 0x57B0) instead of TP-UART. Linux only;
; built inside the simulation container, not on the host.
[env:lab]
platform = platformio/native@1.2.1
build_flags = ${env.build_flags} -Isrc -DMASK_VERSION=0x57B0 -DKNX_NO_AUTOMATIC_GLOBAL_INSTANCE -DKNX_FLASH_SIZE=8192 -DKNX_TUNNELING=4
build_src_flags = -Wall -Wextra -Werror
build_src_filter = +<*> -<firmware/> -<espidf/>
lib_deps = https://github.com/thelsing/knx.git#980c047ad7fc5e27bf2fae95e48acde5d5e0b4fd
